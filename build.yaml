targets:
  $default:
    sources:
      - $package$ # 包的元数据
      - lib/$lib$ # lib 目录的元数据
      - lib/** # lib 下的所有文件
      - test/** # 测试用 Drift 表生成代码
      - tool/** # tool 下的所有文件（包含生成器）
      - assets/** # assets 下的所有文件（包含图片）
      - pubspec.yaml # 用作触发器
    builders:
      drift_dev:
        generate_for:
          - lib/integration/database/**.dart
          - test/core/fixtures/database/**.dart
      json_serializable|json_serializable:
        enabled: true # 必须是 true 或默认
      watermeter|score_hashes:
        enabled: true
        generate_for:
          - pubspec.yaml # 当 pubspec.yaml 改变时触发
      watermeter|application_version:
        enabled: true
        generate_for:
          - pubspec.yaml # 版本号变化时重新生成

builders:
  score_hashes:
    import: "tools/generators/score_hashes_generator.dart"
    builder_factories: ["scoreHashesBuilder"]
    build_extensions:
      pubspec.yaml: # 输入：pubspec.yaml（触发器）
        - lib/generated/score_hashes.g.dart # 输出：生成的常量文件
    auto_apply: root_package
    build_to: source
    required_inputs: # 声明需要的资源文件
      - assets/experiment_score/scores/**

  application_version:
    import: "tools/generators/application_version_generator.dart"
    builder_factories: ["applicationVersionBuilder"]
    build_extensions:
      pubspec.yaml: # 输入：pubspec.yaml（触发器）
        - lib/generated/application_version.g.dart # 输出：版本常量
    auto_apply: root_package
    build_to: source
