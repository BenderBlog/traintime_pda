name: Check Wear OS

on:
  pull_request:
    paths:
      - "wearos/**"
      - ".github/workflows/check_wearos.yaml"
  push:
    branches:
      - main
    paths:
      - "wearos/**"
      - ".github/workflows/check_wearos.yaml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Resolve dependencies
        working-directory: wearos
        run: ../.flutter/bin/flutter pub get

      - name: Analyze
        working-directory: wearos
        run: ../.flutter/bin/flutter analyze

      - name: Test
        working-directory: wearos
        run: ../.flutter/bin/flutter test

      - name: Build Wear OS APK
        working-directory: wearos
        run: ../.flutter/bin/flutter build apk --debug --target-platform android-arm
