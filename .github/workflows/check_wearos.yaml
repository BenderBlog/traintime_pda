name: Check Wear OS

on:
  pull_request:
    paths:
      - "wearos/**"
      - "lib/page/setting/wear_companion_sync_page.dart"
      - "lib/repository/wear_companion_sync.dart"
      - "android/app/src/main/kotlin/io/github/benderblog/traintime_pda/MainActivity.kt"
      - "android/app/src/main/kotlin/io/github/benderblog/traintime_pda/WearCompanionTransport.kt"
      - ".github/workflows/check_wearos.yaml"
  push:
    branches:
      - main
    paths:
      - "wearos/**"
      - "lib/page/setting/wear_companion_sync_page.dart"
      - "lib/repository/wear_companion_sync.dart"
      - "android/app/src/main/kotlin/io/github/benderblog/traintime_pda/MainActivity.kt"
      - "android/app/src/main/kotlin/io/github/benderblog/traintime_pda/WearCompanionTransport.kt"
      - ".github/workflows/check_wearos.yaml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Test and build native Wear OS app
        working-directory: wearos/android
        run: ./gradlew testDebugUnitTest assembleDebug
