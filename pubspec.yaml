name: watermeter
description: Another personal data assistant for XDU.
publish_to: "none"
version: 2.0.0+60

environment:
  sdk: ^3.13.0

dependencies:
  # State Management
  signals: ^7.1.0
  # Network
  dio: ^5.0.0
  synchronized: ^3.1.0+1
  pool: ^1.5.2
  # Cookie Storage
  dio_cookie_manager: ^3.0.0
  cookie_jar: ^4.0.3
  path_provider: ^2.1.0
  # Preference
  shared_preferences: ^2.5.3
  # Json
  json_annotation: ^4.9.0
  # Html Process
  html: ^0.15.4
  charset_converter: ^2.2.1
  # Ids
  image: ^4.2.0
  encrypter_plus: ^5.1.0
  # I18n
  flutter_localizations:
    sdk: flutter
  intl: any
  slang: ^4.18.0
  slang_flutter: ^4.18.0
  # Software info
  device_info_plus: ^13.1.0
  # Widgets
  calendar_date_picker2: ^3.0.0
  material_ui: ^1.3.0
  m3e_core: ^1.1.4
  cupertino_ui: ^1.1.0
  flex_color_scheme: ^9.0.0
  # Talker
  talker_flutter: ^5.0.0
  talker_dio_logger: ^5.0.0
  # Flutter
  flutter:
    sdk: flutter
  # Database ORM
  drift: ^2.35.4
  drift_flutter: ^0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.1
  flutter_launcher_icons: ^0.14.3
  build_runner: ^2.16.2
  flutter_lints: ^6.0.0
  json_serializable: ^6.10.0
  slang_build_runner: ^4.18.0
  drift_dev: ^2.35.3
  # Physical Experiment Hash Generator
  path: ^1.9.1
  build: ^4.0.11
  glob: ^2.2.0

flutter_launcher_icons:
  # Android launcher icons are maintained in android/app/src/main/res.
  android: false
  ios: true
  image_path: "assets/Icon-App-iTunes.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#ffffff"
  image: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/Icon-App-iTunes-Background.png
    - assets/Icon-App-iTunes.png
