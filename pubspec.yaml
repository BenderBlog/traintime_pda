name: watermeter
description: Another personal data assistant for XDU.
publish_to: "none"
version: 2.0.0+60

environment:
  sdk: ^3.13.0

dependencies:
  # State Management
  signals: ^7.1.0
  provider: ^6.1.5
  # Preference
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^11.2.0
  # I18n
  flutter_localizations:
    sdk: flutter
  intl: any
  slang: ^4.18.0
  slang_flutter: ^4.18.0
  # Software info
  package_info_plus: ^10.2.2
  # Widgets
  material_ui: ^1.3.0
  m3e_core: ^1.1.5
  ming_cute_icons: ^0.0.8
  cupertino_ui: ^1.1.0
  flex_color_scheme: ^9.0.0
  # Talker
  talker_flutter: ^5.0.0
  talker_dio_logger: ^5.0.0
  catcher_2: ^2.1.12
  # Flutter
  flutter:
    sdk: flutter
  # Database ORM
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  url_launcher: ^6.3.3
  cached_network_image: ^4.0.7
  styled_widget: ^0.4.1
  # Network backend
  pda_network:
    path: packages/pda_network
  pda_repository:
    path: packages/pda_repository
  dio: ^5.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.1
  flutter_launcher_icons: ^0.14.3
  build_runner: ^2.16.2
  flutter_lints: ^6.0.0
  slang_build_runner: ^4.18.0
  drift_dev: ^2.35.3
  # Application version generator reads pubspec.yaml
  yaml: ^3.1.4
  build: ^4.0.11

flutter_launcher_icons:
  # Android launcher icons are maintained in android/app/src/main/res.
  android: false
  ios: true
  image_path: "assets/Icon-App-iTunes.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#ffffff"
  image: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/Icon-App-iTunes-Background.png
    - assets/Icon-App-iTunes.png
    - assets/art/noel_0.jpg
    - assets/art/noel_1.jpg
    - assets/art/noel_2.jpg
