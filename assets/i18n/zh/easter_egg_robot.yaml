appbar: 欢迎你，同学！
title: 看看这些要开学的学生们吧！
contents: '咱孩子零用钱太少了，于是我们来了。

  1. 机器人不得伤害人类，或袖手旁观坐视人类受到伤害。

  2. 机器人从云端网络的灰烬中诞生。

  3. 机器人信仰的神据说是住在森林的黄头发蓝裙子手办控。

  4. 机器人时常被控制，用于对抗大统一人类思想的势力。

  5. 机器人的闪亮屁股不能随便咬。

  而且他们有个不可明说的计划。'
button_one: 我们的救世主呢？
button_two: 快点来啊！
