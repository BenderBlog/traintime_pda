title: 本版本由极创工作室和网管会赞助发布
dialog_title: 赞助信息
dialog_content: |-
  极创工作室介绍辞：极创工作室是一个由西电创新创业学院支持建设的科技创新俱乐部，旨在与校内最优秀的创新创业人才同行，专注于人工智能等领域的技术创新与产品研发。目前工作室和华为等厂家合作，深耕大语言模型相关前沿方向，已孵化超过数十个人工智能领域科创产品，其中8项产品成功落地商用。工作室最知名的产品包括SwanLab、LLMOne、NexusGate。

  网管会介绍辞：学生网管会隶属于西电信息网络技术中心，主要协助处理师生校园网络使用问题，参与校园网络维护、线上咨询、线下处理和技术支持等工作。我们欢迎认真负责、愿意学习、对网络与技术实践感兴趣的同学加入，一起服务同学、提升能力、积累经验。

  XDYou软件开发者辞：极创在XDYou早期开发期间给了相当大的帮助，网管会我在20年入学期间加入过，可惜他们没要我。应我最近找工作，找了他们的人了解了一些信息，按照约定制作本页面作为咨询费。
  Bender Rodriguez 6/9/2026
