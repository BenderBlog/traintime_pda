  privacy_policy: 隐私政策
  license: 本应用基于 BSD-3-Clause 许可证开源 基于 Ruisi-iOS 和 Ruisi-Android 在 AI 辅助下重写
  privacy_policy_content: '本应用仅在西安电子科技大学校园网内运行，访问睿思论坛 (rs.xidian.edu.cn) 的数据。


    本应用不会收集、存储或传输任何用户的个人信息到第三方服务器。


    用户的登录凭据仅保存在本地设备中，用于与睿思论坛服务器进行身份验证。


    本应用使用 Cookie 与睿思论坛服务器进行通信，所有数据交互均直接在用户的设备与睿思论坛服务器之间进行。


    如有任何疑问，请通过 GitHub 提交 issue 联系开发者。'
