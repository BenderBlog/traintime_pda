    4. 非原生安卓用戶，開啟自啟動和關閉電源優化
  settings_guide_content_2: |-
    課前提醒模塊運行機制：
    1. 首次開啟時自動安排未來幾天的課前提醒
    2. 每次打開應用時自動檢查並更新通知日程
    3. 修改設置後自動重新安排所有通知
