easter_egg_apple: '=== 帶我飛向月亮吧 ===

  歌聲演繹：Frank Sintara, 1964


  帶我飛向月亮吧

  讓我和星星共舞嬉戲


  我好想知道

  木星和火星上的春天

  是什麼顏色的


  讓你的歌聲溫暖我的心

  我會一直歌唱下去


  我日夜都在想你和牽掛你

  請你真心接受我 我愛你


  === 沉浸在你的愛意中 ===

  吉他演奏：Earl Klugh, 1976


  無法忘懷這種感覺，被你的愛包裹的溫暖

  不想失去這種感覺，被你的愛撫摸的舒適

  你讓我感到好自在，被你的愛託舉的堅強

  想一直在你懷中，沉浸在你的愛意中

  我不敢向你說出，我對你的心意和愛

  '
