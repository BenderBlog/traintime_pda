  privacy_policy_content: '本應用僅在西安電子科技大學校園網內運行，訪問睿思論壇 (rs.xidian.edu.cn) 的數據。


    本應用不會收集、存儲或傳輸任何用戶的個人信息到第三方服務器。


    用戶的登錄憑據僅保存在本地設備中，用於與睿思論壇服務器進行身份驗證。


    本應用使用 Cookie 與睿思論壇服務器進行通信，所有數據交互均直接在用戶的設備與睿思論壇服務器之間進行。


    如有任何疑問，請通過 GitHub 提交 issue 聯繫開發者。'
