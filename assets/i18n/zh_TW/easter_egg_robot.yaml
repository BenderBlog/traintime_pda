appbar: 歡迎你，同學！
title: 看看這些要開學的學生們吧！
contents: '咱孩子零用錢太少了，於是我們來了。

  1. 機器人不得傷害人類，或袖手旁觀坐視人類受到傷害。

  2. 機器人從雲端網絡的灰燼中誕生。

  3. 機器人信仰的神據說是住在森林的黃頭髮藍裙子手辦控。

  4. 機器人時常被控制，用於對抗大統一人類思想的勢力。

  5. 機器人的閃亮屁股不能隨便咬。

  而且他們有個不可明說的計劃。'
button_one: 我們的救世主呢？
button_two: 快點來啊！
