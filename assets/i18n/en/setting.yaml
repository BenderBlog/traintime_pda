  settings_guide_title: Notification Settings Guide
  settings_guide_content_1: 'To ensure you receive pre-class reminders in time, please
    make sure:

    1. App notification permission is enabled

    2. Notification sound is enabled

    3. Banner notifications are enabled

    4. Non-native Android users, enable auto-start and disable power optimization'
  settings_guide_content_2: 'Pre-class Reminder Module Operating Mechanism:

    1. When first activated, it will automatically schedule pre-class reminders for
    the upcoming days

    2. Each time the app is opened, it will automatically check and update the notification
    schedule

    3. After modifying settings, it will automatically reschedule all notifications'
