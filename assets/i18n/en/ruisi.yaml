about:
  title: About
  app_name: Ruisi
  subtitle: Xidian University Campus Forum Client
  version: Version
  version_number: 2.0.0 (Bundled with XDYou 1.6.0)
  source_code: Source Code
  bug_report: Report Issue
  bug_report_subtitle: Submit an issue on GitHub
  privacy_policy: Privacy Policy
  license: Open-sourced under the BSD-3-Clause License Reimplemented based on Ruisi-iOS
    and Ruisi-Android with AI assistant
  privacy_policy_content: 'This app only operates on the Xidian University campus
    network, accessing data from the Ruisi Forum (rs.xidian.edu.cn).


    This app does not collect, store, or transmit any personal information to third-party
    servers.


    User login credentials are stored only on the local device, used for authentication
    with the Ruisi Forum server.


    This app uses cookies to communicate with the Ruisi Forum server. All data exchange
    occurs directly between the user''s device and the Ruisi Forum server.


    If you have any questions, please contact the developer by submitting an issue
    on GitHub.'
